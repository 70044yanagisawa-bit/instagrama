name: Instagram 自動投稿

on:
  schedule:
    # GitHub の時刻は UTC（日本時間 −9 時間）。混雑で数分〜数十分遅れることがあるので早めに起動する
    - cron: "30 8 * * *"   # 17:30 JST 素材を選んで編集し、LINE に確認を送る
    - cron: "40 10 * * *"  # 19:40 JST 起動して 20:00 に投稿する
  workflow_dispatch:
    inputs:
      command:
        description: "prepare（準備して LINE 確認）または publish（投稿）"
        type: choice
        options: [prepare, publish]
        default: prepare

permissions:
  contents: write  # state/state.json を保存するため

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 実行
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cmd="${{ inputs.command }}"
          elif [ "${{ github.event.schedule }}" = "30 8 * * *" ]; then
            cmd=prepare
          else
            cmd=publish
          fi
          python -m autopost "$cmd"

      - name: 記録を保存
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state/state.json
          if ! git diff --cached --quiet; then
            git commit -m "記録を更新（$(TZ=Asia/Tokyo date '+%m/%d %H:%M')）"
            git push
          fi
